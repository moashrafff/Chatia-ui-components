name: Publish KMP Library

on:
  workflow_dispatch:
    inputs:
      versionName:
        description: "Version to publish (e.g. 1.0.3)"
        required: true

jobs:
  publish:
    runs-on: macos-latest
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Validate Gradle Wrapper
        uses: gradle/actions/wrapper-validation@v3

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Make Gradle executable
        run: chmod +x gradlew

      - name: Setup Gradle (cache & build scan init)
        uses: gradle/actions/setup-gradle@v3

      # Build ONLY the library; skip all lint to avoid Kotlin/AGP lint incompatibilities
      - name: Build library (no lint)
        uses: gradle/gradle-build-action@v2
        with:
          arguments: >
            :chatia-ui-components:assemble
            :chatia-ui-components:check
            -x lint
            --no-daemon
            --stacktrace

      # Publish ONLY the library with Vanniktech Maven Publish
      - name: Publish Library
        run: |
          echo "Publishing and Releasing library 🚀"
          ./gradlew publish
          echo "Published and Released ✅"
        env:
          ORG_GRADLE_PROJECT_VERSION_NAME: ${{ github.event.inputs.versionName }}
          ORG_GRADLE_PROJECT_signingInMemoryKey: ${{ secrets.ORG_GRADLE_PROJECT_SIGNINGINMEMORYKEY }}
          ORG_GRADLE_PROJECT_signingInMemoryKeyPassword: ${{ secrets.ORG_GRADLE_PROJECT_SIGNINGINMEMORYKEYPASSWORD }}
          ORG_GRADLE_PROJECT_mavenCentralUsername: ${{ secrets.ORG_GRADLE_PROJECT_MAVENCENTRALUSERNAME }}
          ORG_GRADLE_PROJECT_mavenCentralPassword: ${{ secrets.ORG_GRADLE_PROJECT_MAVENCENTRALPASSWORD }}

      - name: Create and push tag
        run: |
          git config --global user.email "mohamed.ashraf.radi0@gmail.com"
          git config --global user.name "$GITHUB_ACTOR"
          
          git tag -a $TAG -m "Release v$TAG"
          git push origin $TAG
        env:
          TAG: ${{ github.event.inputs.versionName }}

      - name: Create Release on GitHub
        id: create_release
        uses: actions/create-release@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tag_name: ${{ github.event.inputs.versionName }}
          release_name: ${{ github.event.inputs.versionName }}
          draft: true
          prerelease: false


