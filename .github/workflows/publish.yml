name: Publish

on:
  workflow_dispatch:
    inputs:
      versionName:
        description: "Version to publish (e.g. 1.0.3)"
        required: true

jobs:
  publish:
    runs-on: macos-latest

    permissions:
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      # Ensure Android SDK/build-tools exist
      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Make gradlew executable
        run: chmod +x gradlew

      # Cache only; this step does not run Gradle itself
      - name: Setup Gradle caching
        uses: gradle/actions/setup-gradle@v3

      # Build ONLY the library; skip all lint everywhere (and explicitly skip sample app lint)
      - name: Build library (no lint)
        uses: gradle/gradle-build-action@v2
        with:
          arguments: >
            :chatia-ui-components:assemble
            :chatia-ui-components:check
            -x lint
            -x :sample:composeApp:lint
            -x :sample:composeApp:lintVitalAnalyzeRelease
            --no-daemon --stacktrace

      # Publish ONLY the library; skip lint
      - name: Publish to Maven Central (no lint)
        uses: gradle/gradle-build-action@v2
        env:
          ORG_GRADLE_PROJECT_version: ${{ github.event.inputs.versionName }}
          ORG_GRADLE_PROJECT_signingInMemoryKey: ${{ secrets.ORG_GRADLE_PROJECT_SIGNINGINMEMORYKEY }}
          ORG_GRADLE_PROJECT_signingInMemoryKeyPassword: ${{ secrets.ORG_GRADLE_PROJECT_SIGNINGINMEMORYKEYPASSWORD }}
          ORG_GRADLE_PROJECT_mavenCentralUsername: ${{ secrets.ORG_GRADLE_PROJECT_MAVENCENTRALUSERNAME }}
          ORG_GRADLE_PROJECT_mavenCentralPassword: ${{ secrets.ORG_GRADLE_PROJECT_MAVENCENTRALPASSWORD }}
        with:
          arguments: >
            :chatia-ui-components:publishAllPublicationsToMavenCentralRepository
            -x lint
            -x :sample:composeApp:lint
            -x :sample:composeApp:lintVitalAnalyzeRelease
            --no-daemon --stacktrace