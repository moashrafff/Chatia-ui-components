name: Publish

on:
  workflow_dispatch:
    inputs:
      versionName:
        description: 'Version (e.g. 1.0.0)'
        required: true

jobs:
  publish:
    name: Publish to Maven Central
    runs-on: ubuntu-latest  # macOS not needed; Ubuntu is faster/cheaper

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Grant permission to execute Gradle
        run: chmod +x gradlew

      - name: Build (optional but recommended)
        uses: gradle/gradle-build-action@v2
        with:
          arguments: build

      - name: Publish Library
        run: |
          echo "Publishing library 🚀"
          ./gradlew publish --no-daemon
          echo "Published ✅"
        env:
          # Set the Gradle 'version' property from the workflow input
          ORG_GRADLE_PROJECT_version: ${{ github.event.inputs.versionName }}

          # In-memory signing (exact camelCase keys expected by VannikTech)
          ORG_GRADLE_PROJECT_signingInMemoryKey: ${{ secrets.ORG_GRADLE_PROJECT_SIGNINGINMEMORYKEY }}
          ORG_GRADLE_PROJECT_signingInMemoryKeyPassword: ${{ secrets.ORG_GRADLE_PROJECT_SIGNINGINMEMORYKEYPASSWORD }}

          # Sonatype (Maven Central) credentials
          ORG_GRADLE_PROJECT_mavenCentralUsername: ${{ secrets.ORG_GRADLE_PROJECT_MAVENCENTRALUSERNAME }}
          ORG_GRADLE_PROJECT_mavenCentralPassword: ${{ secrets.ORG_GRADLE_PROJECT_MAVENCENTRALPASSWORD }}

      - name: Create and push tag
        run: |
          git config user.email "${{ github.actor }}@users.noreply.github.com"
          git config user.name  "${{ github.actor }}"
          git tag -a "v${{ github.event.inputs.versionName }}" -m "Release v${{ github.event.inputs.versionName }}"
          git push origin "v${{ github.event.inputs.versionName }}"

      - name: Create Release (draft)
        uses: softprops/action-gh-release@v2
        with:
          tag_name: "v${{ github.event.inputs.versionName }}"
          name: "v${{ github.event.inputs.versionName }}"
          draft: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}